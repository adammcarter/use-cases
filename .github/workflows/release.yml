name: release

# One tagged release (ADR 039): the same binary for macOS (universal), Linux x86_64 and Linux arm64.
# Each platform job packs and smoke-tests its tarball; one publish job then makes the GitHub
# release (tarballs, checksums, the plugin archive and the plugin zip) and, when a tap token exists,
# updates the Homebrew formula. The plugin is installed from the release's use-cases-plugin.zip
# through the marketplace in this repository (.claude-plugin/marketplace.json). The plugin, Homebrew
# and the downloads all come from this one tag.
#
# Push a tag v<ProductVersion> to release. Run it by hand with dry_run on to build and smoke-test
# everything and publish nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test only; publish nothing
        type: boolean
        default: true

# The repository that holds the release and the tap that holds the formula: the only two places
# the names are written.
env:
  RELEASE_REPOSITORY: ${{ github.repository }}
  HOMEBREW_TAP_REPOSITORY: ${{ github.repository_owner }}/homebrew-use-cases

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-universal:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Release scripts
        run: scripts/test-release
      - name: Package
        run: |
          if [ -n "$TAG" ]; then scripts/package-release "$TAG"; else scripts/package-release; fi
      - name: Smoke test
        # Without the build folder: SwiftPM falls back to a bundle path inside it, which would hide a
        # tarball that is missing its bundles.
        run: |
          rm -rf UseCases/.build
          scripts/smoke-release dist/use-cases-*-macos-universal.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: dist/use-cases-*.tar.gz*
          if-no-files-found: error

  linux-x86_64:
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.2-noble
      options: --init
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Zip tools
        # The swift image holds neither: package-plugin makes the plugin zip, test-release reads it.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends zip unzip
      - name: Release scripts
        run: scripts/test-release
      - name: Package
        run: |
          if [ -n "$TAG" ]; then scripts/package-release "$TAG"; else scripts/package-release; fi
      - name: Smoke test
        # Without the build folder: SwiftPM falls back to a bundle path inside it, which would hide a
        # tarball that is missing its bundles.
        run: |
          rm -rf UseCases/.build
          scripts/smoke-release dist/use-cases-*-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/use-cases-*.tar.gz*
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: swift:6.4.2-noble
      options: --init
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Zip tools
        # The swift image holds neither: package-plugin makes the plugin zip, test-release reads it.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends zip unzip
      - name: Release scripts
        run: scripts/test-release
      - name: Package
        run: |
          if [ -n "$TAG" ]; then scripts/package-release "$TAG"; else scripts/package-release; fi
      - name: Smoke test
        # Without the build folder: SwiftPM falls back to a bundle path inside it, which would hide a
        # tarball that is missing its bundles.
        run: |
          rm -rf UseCases/.build
          scripts/smoke-release dist/use-cases-*-linux-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: dist/use-cases-*.tar.gz*
          if-no-files-found: error

  publish:
    needs: [macos-universal, linux-x86_64, linux-arm64]
    # Only a pushed tag publishes, and never a dry run.
    if: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check the downloads against their checksums
        run: |
          cd dist
          sha256sum -c ./*.sha256
      - name: Assemble the plugin archive
        env:
          RELEASE_OWNER: ${{ github.repository_owner }}
        run: scripts/package-plugin "$GITHUB_REF_NAME"
      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 dist/use-cases-plugin.zip \
            --repo "$RELEASE_REPOSITORY" --verify-tag --title "use-cases ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Check out the Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the Homebrew formula
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          mkdir -p tap/Formula
          scripts/render-formula "${GITHUB_REF_NAME#v}" dist > tap/Formula/use-cases.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/use-cases.rb
          git commit -m "use-cases ${GITHUB_REF_NAME#v}"
          git push
      - name: Say that the formula was not updated
        if: ${{ env.HOMEBREW_TAP_TOKEN == '' }}
        run: echo "::notice::No HOMEBREW_TAP_TOKEN secret, so the Homebrew formula in $HOMEBREW_TAP_REPOSITORY was not updated."
