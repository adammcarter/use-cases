schema_version: 1
feature:
  id: plugin.init
  name: Repo init
  summary: use-cases init takes a fresh repo from nothing to use-case driven in one command, and the /use-cases:init skill runs it and hands the agent to the development loop.
use_cases:
  - id: plugin.init.records_decision_in_agents_md
    title: init records the use-case-driven decision in AGENTS.md
    lifecycle: active
    value_tier: critical
    journey_role: golden
    usage_frequency: occasional
    tags:
      - init
      - agents-md
    source_refs:
      - kind: file
        path: packages/core/src/init/scaffold.ts
    actor: agent
    intent: Leave a cross-host record that this repo is use-case driven, with the date, a signpost to the plugin's skills and an instruction to follow them, so every agent on every host reads the same answer.
    preconditions:
      - use-cases init runs in a repo with no use-cases.yml.
    trigger: The agent runs use-cases init --repo . from the /use-cases:init skill.
    scenarios:
      - id: plugin.init.records_decision_in_agents_md.golden_no_file
        kind: steps
        steps:
          - Run use-cases init in a repo with no AGENTS.md.
          - Read the created file and its "## Use-case driven development" section.
        observable_outcomes:
          - AGENTS.md is created holding the section with "yes — <today>", a pointer to the use-cases and use-case-driven-development skills, and the instruction that agents follow them.
      - id: plugin.init.records_decision_in_agents_md.edge_existing_file
        kind: steps
        steps:
          - Run use-cases init in a repo whose AGENTS.md has other content.
          - Compare the file before and after.
        observable_outcomes:
          - The existing content is untouched and the section is appended after it.
      - id: plugin.init.records_decision_in_agents_md.edge_already_recorded
        kind: steps
        steps:
          - Run use-cases init in a repo whose AGENTS.md already has the section, with yes or no.
          - Read the file and the result.
        observable_outcomes:
          - The file is unchanged and the result names the existing answer.
          - A recorded no is left standing, not overwritten with a yes.
      - id: plugin.init.records_decision_in_agents_md.bad_second_run_is_blocked
        kind: steps
        steps:
          - Run use-cases init twice in the same repo.
          - Read the second result and count the sections in AGENTS.md.
        observable_outcomes:
          - The second run is blocked as today, and AGENTS.md still has exactly one section.
          - AGENTS.md carries exactly one decision section after any number of runs.
    observable_outcomes:
      - AGENTS.md carries exactly one decision section after any number of runs.
      - The section is the one the use-case-driven-development skill reads.
    host_applicability:
      - host_surface: claude.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesCore
            - --filter
            - WorkspaceScaffoldTests
          inputs:
            - UseCasesCore/Tests/UseCasesCoreTests/Initialization/WorkspaceScaffoldTests.swift
            - UseCasesCore/Sources/UseCasesCore/Initialization/ScaffoldFiles.swift
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: plugin.init.wires_git_hooks
    title: init wires the pre-commit and pre-push hooks
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: occasional
    tags:
      - init
      - git-hooks
    source_refs:
      - kind: file
        path: packages/core/src/init/scaffold.ts
    actor: agent
    intent: Have git enforce the matrix from day one — pre-commit blocks on an invalid matrix, ledger or marker; pre-push only reports — without clobbering hooks the repo already has.
    preconditions:
      - use-cases init runs in a git repo with no use-cases.yml.
    trigger: The agent runs use-cases init --repo .
    scenarios:
      - id: plugin.init.wires_git_hooks.golden_fresh_repo
        kind: steps
        steps:
          - Run use-cases init in a git repo with no hooks.
          - Read .githooks/pre-commit and .githooks/pre-push and the configured hooksPath.
          - Read what each hook runs.
        observable_outcomes:
          - Both hooks exist, are executable, and core.hooksPath is .githooks.
          - pre-commit runs use-cases matrix validate, use-cases validate-ledger and a scan for INVALID; pre-push runs use-cases impact and use-cases scan and always exits 0.
      - id: plugin.init.wires_git_hooks.bad_uc_missing_warns_rather_than_blocks
        kind: steps
        steps:
          - Run the written pre-commit with no use-cases on PATH and no override.
          - Read the exit code and the warning.
        observable_outcomes:
          - It exits 0 with a warning naming the install route, so a contributor without the plugin is not locked out.
          - A missing tool is never allowed to lock a repo.
      - id: plugin.init.wires_git_hooks.edge_existing_hooks_path
        kind: steps
        steps:
          - Run use-cases init in a repo where core.hooksPath already points elsewhere with its own pre-commit.
          - Read that directory and the git config afterwards.
        observable_outcomes:
          - The hooks are written into that directory, the existing pre-commit keeps its content with the use-cases block appended, and hooksPath is left alone.
          - Existing hooks are extended, never replaced.
      - id: plugin.init.wires_git_hooks.edge_not_a_git_repo
        kind: steps
        steps:
          - Run use-cases init in a directory that is not a git repo.
          - Read the written files and the result.
        observable_outcomes:
          - The hook files are still written and the result notes that hooksPath was not set.
    observable_outcomes:
      - A fresh yes repo has enforcement from the first commit.
      - Existing hooks are extended, never replaced.
    host_applicability:
      - host_surface: claude.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesCore
            - --filter
            - WorkspaceScaffoldTests
          inputs:
            - UseCasesCore/Tests/UseCasesCoreTests/Initialization/WorkspaceScaffoldTests.swift
            - UseCasesCore/Sources/UseCasesCore/Initialization/ScaffoldFiles.swift
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: plugin.init.vends_sample_matrix
    title: init vends a sample row that shows the whole shape
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: occasional
    tags:
      - init
      - template
      - no-bad-path
    source_refs:
      - kind: file
        path: packages/core/src/init/scaffold.ts
    actor: agent
    intent: Give a new repo one worked example of a row — golden, bad and edge scenarios, every field explained in a comment — so the first real row is written by copying, not by reading the schema.
    preconditions:
      - use-cases init runs in a repo with no use-cases.yml.
    trigger: The agent runs use-cases init --repo .
    scenarios:
      - id: plugin.init.vends_sample_matrix.golden_shape
        kind: steps
        steps:
          - Run use-cases init and read use-cases/example.yml.
          - Read the sample row's scenarios and comments.
        observable_outcomes:
          - The sample row carries a golden, a bad and an edge scenario, a comment on every top-level field, and a note that each scenario becomes one test.
          - The sample is a template to copy, not a placeholder to delete.
      - id: plugin.init.vends_sample_matrix.golden_validates
        kind: steps
        steps:
          - Run use-cases matrix validate on the fresh workspace.
          - Read the result.
        observable_outcomes:
          - A fresh workspace validates clean.
      - id: plugin.init.vends_sample_matrix.edge_honest_scan
        kind: steps
        steps:
          - Run use-cases scan on the fresh workspace.
          - Read the sample row's status.
        observable_outcomes:
          - The sample row reads UNBOUND with no INVALID rows, so a fresh repo never claims coverage it lacks.
    observable_outcomes:
      - The sample is a template to copy, not a placeholder to delete.
      - A fresh workspace validates and scans clean.
    host_applicability:
      - host_surface: claude.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesCore
            - --filter
            - ScaffoldedWorkspaceTests
          inputs:
            - UseCasesCore/Tests/UseCasesCoreTests/Initialization/ScaffoldedWorkspaceTests.swift
            - UseCasesCore/Sources/UseCasesCore/Initialization/ScaffoldTemplates.swift
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: plugin.init.skill_hands_off
    title: The init skill runs use-cases init and hands over to the loop
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: occasional
    tags:
      - init
      - skills
      - no-bad-path
    source_refs:
      - kind: file
        path: skills/init/SKILL.md
    actor: agent
    intent: Make /use-cases:init the one thing an agent runs in a new repo — it runs use-cases init, reports what was written, and ends by invoking /use-cases:use-case-driven-development so the loop starts at once.
    preconditions:
      - The plugin is installed; the repo may be empty.
    trigger: The user or agent invokes /use-cases:init.
    scenarios:
      - id: plugin.init.skill_hands_off.golden_text
        kind: steps
        steps:
          - Read skills/init/SKILL.md.
          - Follow what it instructs the agent to do, in order.
        observable_outcomes:
          - It runs use-cases init --repo ., tells the agent to read AGENTS.md back, and ends by invoking the use-case-driven-development skill.
          - One slash command takes a repo from empty to inside the loop.
      - id: plugin.init.skill_hands_off.edge_already_initialised
        kind: steps
        steps:
          - Read the skill's guidance for a repo where use-cases init is blocked because use-cases.yml already exists.
          - Follow what it tells the agent to do instead.
        observable_outcomes:
          - It says to read the recorded answer in AGENTS.md and go straight to the loop.
          - An already-adopted repo is never sent round the init path again.
    observable_outcomes:
      - One slash command takes a repo from empty to inside the loop.
    host_applicability:
      - host_surface: claude.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesOracle
            - --filter
            - InitSkillTests
          inputs:
            - UseCasesOracle/Tests/OracleTests/Plugin/InitSkillTests.swift
            - skills/init/SKILL.md
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: plugin.init.loop_skill_ported
    title: The use-case-driven-development skill ships in the plugin, host-neutral
    lifecycle: active
    value_tier: critical
    journey_role: golden
    usage_frequency: common
    tags:
      - skills
      - loop
      - no-edge-path
    source_refs:
      - kind: file
        path: skills/use-case-driven-development/SKILL.md
    actor: agent
    intent: Give every host the same loop — the AGENTS.md decision, the matrix as the entry point, rows before tests, markers around tests and code, the scan as the coverage number — with nothing in it that only one machine or one host can do.
    preconditions:
      - The plugin is installed on any supported host.
    trigger: An agent loads /use-cases:use-case-driven-development at the start of framing, or the init skill hands over to it.
    scenarios:
      - id: plugin.init.loop_skill_ported.golden_present_and_canonical
        kind: steps
        steps:
          - Read skills/use-case-driven-development/SKILL.md.
          - Compare its front-matter name with its directory and with the plugin's canonical skill list.
        observable_outcomes:
          - Its front-matter name matches the directory and the skill is in the canonical list, so doctor and every host see it.
      - id: plugin.init.loop_skill_ported.golden_covers_the_loop
        kind: steps
        steps:
          - Read the skill for the order it puts the phases in.
          - Check which use-cases commands and MCP tools each phase names.
        observable_outcomes:
          - It reads the AGENTS.md section first and sends a repo without one to /use-cases:init.
          - It covers understand, frame, build, verify, sign-off and land, and names bind, verify, scan and recover.
          - A repo without the decision is sent to init rather than asked ad hoc.
      - id: plugin.init.loop_skill_ported.bad_nothing_host_specific
        kind: steps
        steps:
          - Search the skill for machine- or host-specific instructions.
          - Check each hit against what a host other than Claude could do.
        observable_outcomes:
          - There is no talk-to-myself, no npm install, no ~/.claude path, no agent-setup skill named as a dependency, and no simulator or Xcode step.
          - One loop skill, read the same way on Claude, Copilot, Codex and OpenCode.
    observable_outcomes:
      - One loop skill, read the same way on Claude, Copilot, Codex and OpenCode.
      - A repo without the decision is sent to init rather than asked ad hoc.
    host_applicability:
      - host_surface: claude.cli
        supported: true
      - host_surface: codex.cli
        supported: true
      - host_surface: copilot.cli
        supported: true
      - host_surface: opencode.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesOracle
            - --filter
            - PluginInitLoopSkillTests
          inputs:
            - UseCasesOracle/Tests/OracleTests/Cli/PluginInitLoopSkillTests.swift
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
