schema_version: 1
feature:
  id: plugin.install
  name: Plugin install
  summary: A public GitHub repo any agent host installs as a plugin, with skills, agents, the MCP server and the uc command all reachable on the first session.
use_cases:
  - id: plugin.install.claude_from_github
    title: Claude Code installs the plugin straight from GitHub
    lifecycle: active
    value_tier: critical
    journey_role: golden
    usage_frequency: common
    tags:
      - plugin
      - install
      - claude
    source_refs:
      - kind: file
        path: .claude-plugin/plugin.json
      - kind: file
        path: .claude-plugin/marketplace.json
      - kind: file
        path: skills
    actor: user
    intent: Install the plugin into Claude Code with two commands and have the skills, agents and MCP tools present on the next session, with no npm and no build.
    preconditions:
      - The repo is public on GitHub at adammcarter/use-cases with the manifests at the root.
      - Node is on PATH on the user's machine.
    trigger: The user runs /plugin marketplace add adammcarter/use-cases then /plugin install use-cases@use-cases.
    scenarios:
      - id: plugin.install.claude_from_github.golden_manifests_point_at_real_files
        kind: steps
        steps:
          - Read .claude-plugin/plugin.json.
          - Confirm every declared agent path exists, the MCP server command is node on ${CLAUDE_PLUGIN_ROOT}/dist/uc-mcp.js, and hooks resolve to hooks/hooks.json.
        observable_outcomes:
          - Every entry in the Claude manifest points at a file that exists and at the committed bundle.
      - id: plugin.install.claude_from_github.golden_marketplace_offers_the_repo_root
        kind: steps
        steps:
          - Read .claude-plugin/marketplace.json.
          - Confirm it offers use-cases with source "." so the plugin is the repo root.
        observable_outcomes:
          - Two commands install the plugin; nothing else is downloaded or built.
      - id: plugin.install.claude_from_github.golden_skills_in_the_scanned_dir
        kind: steps
        steps:
          - Confirm the four canonical skills live under skills/<name>/SKILL.md at the repo root, the directory Claude scans by default.
          - Confirm each SKILL.md front-matter name matches its directory.
        observable_outcomes:
          - Skills appear as /use-cases:<skill> because the front-matter name matches the directory.
      - id: plugin.install.claude_from_github.bad_manifest_pointing_at_a_missing_file
        kind: steps
        steps:
          - Point a manifest entry at a file that does not exist.
          - Run the manifest test.
        observable_outcomes:
          - A manifest that points at a missing file fails the test before it can ship.
          - A broken install is caught here rather than on a user's machine.
      - id: plugin.install.claude_from_github.edge_live_session
        kind: steps
        steps:
          - In Claude Code run the two install commands, then start a new session.
          - Confirm the four skills are listed, the three agents are available, and the use-cases MCP server reports its tools.
        observable_outcomes:
          - Skills appear as /use-cases:<skill> and the MCP tools are live on the next session.
    observable_outcomes:
      - Two commands install the plugin; nothing else is downloaded or built.
      - Skills appear as /use-cases:<skill> and the MCP tools are live on the next session.
      - A manifest that points at a missing file fails the test before it can ship.
    host_applicability:
      - host_surface: claude.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/plugin/claude-install.test.ts
          inputs:
            - tests/plugin/claude-install.test.ts
            - .claude-plugin/plugin.json
            - .claude-plugin/marketplace.json
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: plugin.install.uc_on_path_in_session
    title: uc is a plain command inside any session
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: common
    tags:
      - plugin
      - install
      - hooks
    source_refs:
      - kind: file
        path: bin/uc
      - kind: file
        path: hooks/session-start
    actor: agent
    intent: Run uc from a skill or agent body exactly as written, with nothing installed globally, because the plugin puts its own bin/ on PATH at session start where the host allows it and names the binary's path in the bootstrap everywhere.
    preconditions:
      - The plugin is installed and its session-start hook runs.
    trigger: The host starts a session and runs hooks/session-start.
    scenarios:
      - id: plugin.install.uc_on_path_in_session.golden_bin_runs_the_bundle
        kind: steps
        steps:
          - Run bin/uc version --json from any working directory.
          - Confirm it runs dist/uc.js and prints the version envelope.
        observable_outcomes:
          - uc works in a session without any global install, from any working directory.
      - id: plugin.install.uc_on_path_in_session.golden_hook_exports_path
        kind: steps
        steps:
          - Run hooks/session-start with CLAUDE_ENV_FILE pointing at a writable file.
          - Read the printed JSON and then the env file.
        observable_outcomes:
          - The hook still prints the bootstrap JSON, and the env file now contains an export putting the plugin's bin/ first on PATH.
      - id: plugin.install.uc_on_path_in_session.bad_unwritable_env_file
        kind: steps
        steps:
          - Run hooks/session-start with CLAUDE_ENV_FILE pointing into a directory that does not exist.
          - Read stdout, the exit code and stderr.
        observable_outcomes:
          - The bootstrap JSON is still printed, the exit code is 0, and stderr names the file it could not write.
          - Delivering the bootstrap never depends on the PATH export succeeding.
      - id: plugin.install.uc_on_path_in_session.edge_no_env_file
        kind: steps
        steps:
          - Run hooks/session-start with CLAUDE_ENV_FILE unset.
          - Confirm what is printed and what is written.
        observable_outcomes:
          - The bootstrap JSON is printed and nothing else is written.
      - id: plugin.install.uc_on_path_in_session.edge_bootstrap_names_the_path
        kind: steps
        steps:
          - Run hooks/session-start on any host.
          - Read the last line of the injected bootstrap.
        observable_outcomes:
          - The bootstrap ends by naming the absolute path of the plugin's bin/uc, so an agent whose host cannot alter PATH still runs the right binary.
          - Every host's agent is told where uc lives, whether or not PATH was changed.
    observable_outcomes:
      - uc works in a session without any global install.
      - Delivering the bootstrap never depends on the PATH export succeeding.
      - Every host's agent is told where uc lives, whether or not PATH was changed.
    host_applicability:
      - host_surface: claude.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/plugin/session-path.test.ts
          inputs:
            - tests/plugin/session-path.test.ts
            - bin/uc
            - hooks/session-start
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: plugin.install.copilot_from_github
    title: Copilot CLI installs the plugin straight from GitHub
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: occasional
    tags:
      - plugin
      - install
      - copilot
    source_refs:
      - kind: file
        path: .claude-plugin/plugin.json
      - kind: file
        path: hooks/hooks.json
      - kind: file
        path: hooks/session-start
    actor: user
    intent: Install the plugin into GitHub Copilot CLI with one command and have the skills, bootstrap and MCP tools present, with no npm and no build. Copilot reads the Claude manifest and hook; a root Agent Plugins manifest makes it ignore the hook, so none ships.
    preconditions:
      - The repo is public on GitHub with the Claude manifests and no root plugin.json.
      - Node is on PATH on the user's machine.
    trigger: The user runs copilot plugin install adammcarter/use-cases.
    scenarios:
      - id: plugin.install.copilot_from_github.golden_claude_manifest_serves_copilot
        kind: steps
        steps:
          - Confirm Copilot reads .claude-plugin/plugin.json and hooks/hooks.json, interpolating ${CLAUDE_PLUGIN_ROOT} in both.
          - Confirm hooks/hooks.json wires SessionStart to hooks/session-start with that variable.
        observable_outcomes:
          - One command installs the plugin; skills and the bootstrap are present on the first session.
      - id: plugin.install.copilot_from_github.bad_root_manifest_would_hide_the_hook
        kind: steps
        steps:
          - Confirm no plugin.json or mcp.json exists at the repo root.
          - "Read why: a root Agent Plugins manifest makes Copilot ignore hooks/hooks.json."
        observable_outcomes:
          - No root Agent Plugins manifest ships, so Copilot keeps reading the Claude manifest and hook.
          - The absence is deliberate and is asserted, not merely true today.
      - id: plugin.install.copilot_from_github.edge_hook_shape_on_both_hosts
        kind: steps
        steps:
          - Run hooks/session-start with COPILOT_CLI=1, and again without it.
          - Compare the two JSON shapes.
        observable_outcomes:
          - The first has a top-level additionalContext and the second the Claude shape; Copilot accepts the Claude shape, so both deliver the bootstrap.
      - id: plugin.install.copilot_from_github.edge_live_session
        kind: steps
        steps:
          - Install with copilot plugin install, then copilot mcp enable use-cases.
          - In a copilot -p session confirm the four skills, the bootstrap text and the use-cases MCP tools.
        observable_outcomes:
          - The plugin's MCP server appears in copilot mcp list and works once enabled.
    observable_outcomes:
      - One command installs the plugin; the plugin's MCP server appears in copilot mcp list and works once enabled.
      - Skills and the bootstrap are present on the first session.
    host_applicability:
      - host_surface: copilot.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/plugin/host-manifests.test.ts
          inputs:
            - tests/plugin/host-manifests.test.ts
            - .claude-plugin/plugin.json
            - hooks/hooks.json
            - hooks/session-start
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: plugin.install.codex_from_github
    title: Codex installs the plugin from its marketplace
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: occasional
    tags:
      - plugin
      - install
      - codex
    source_refs:
      - kind: file
        path: .codex-plugin/plugin.json
      - kind: file
        path: .codex-plugin/mcp.json
    actor: user
    intent: Install the plugin into Codex with two commands and have the skills, bootstrap and MCP server registered.
    preconditions:
      - The repo is public on GitHub; Codex reads .claude-plugin/marketplace.json as its marketplace.
    trigger: The user runs codex plugin marketplace add adammcarter/use-cases then codex plugin add use-cases@use-cases.
    scenarios:
      - id: plugin.install.codex_from_github.golden_codex_manifest
        kind: steps
        steps:
          - Read .codex-plugin/plugin.json.
          - Confirm it names the skills directory, points mcpServers at .codex-plugin/mcp.json, declares the SessionStart hook, and matches the Claude manifest's name and version.
          - Confirm .codex-plugin/mcp.json runs node on ./dist/uc-mcp.js with cwd "." so the path resolves inside the plugin root.
        observable_outcomes:
          - The MCP server is declared in Codex's own manifest form.
          - Two commands install the plugin; skills are visible to Codex.
      - id: plugin.install.codex_from_github.bad_root_mcp_json_would_break_copilot
        kind: steps
        steps:
          - Confirm no .mcp.json exists at the repo root.
          - "Read why: Copilot reads a root .mcp.json as workspace config, and its relative path breaks the plugin's MCP server there."
        observable_outcomes:
          - No root .mcp.json ships, so one host's manifest cannot silently break another's.
          - The Codex MCP declaration lives under .codex-plugin/ for that reason.
      - id: plugin.install.codex_from_github.edge_live_skills
        kind: steps
        steps:
          - Install from the marketplace and run codex debug prompt-input.
          - Confirm the four skills are listed as use-cases:<name>.
        observable_outcomes:
          - Skills are visible to Codex after two commands.
      - id: plugin.install.codex_from_github.edge_live_mcp_not_yet_observed
        kind: steps
        steps:
          - In a Codex session confirm the use-cases MCP tools are present.
          - Not yet performed; the account's Codex usage cap blocked a session on 2026-09-16.
        observable_outcomes:
          - The MCP server's live appearance in Codex is still to be observed, and the row says so rather than claiming it.
    observable_outcomes:
      - Two commands install the plugin; skills are visible to Codex.
      - The MCP server is declared in Codex's own manifest form; its live appearance is still to be observed.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/plugin/host-manifests.test.ts
          inputs:
            - tests/plugin/host-manifests.test.ts
            - .codex-plugin/plugin.json
            - .codex-plugin/mcp.json
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: plugin.install.opencode_from_git
    title: OpenCode installs the plugin from git
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: occasional
    tags:
      - plugin
      - install
      - opencode
    source_refs:
      - kind: file
        path: opencode/plugin.js
      - kind: file
        path: package.json
    actor: user
    intent: Install the plugin into OpenCode with one command and have the MCP server, the skills, the bootstrap and uc on PATH, all registered by the plugin module itself.
    preconditions:
      - The repo is public on GitHub; package.json exports the OpenCode plugin module.
      - Node is on PATH on the user's machine.
    trigger: The user runs opencode plugin add 'github:adammcarter/use-cases'.
    scenarios:
      - id: plugin.install.opencode_from_git.golden_module_registers_everything
        kind: steps
        steps:
          - Load opencode/plugin.js and call setup with a fake context.
          - Confirm it sets an MCP server named use-cases running node on the bundle, adds one skill per skills/<name>/SKILL.md, pushes the bootstrap into the system prompt for context, compaction, generate and title, and puts bin/ first on PATH for shells.
        observable_outcomes:
          - The plugin module is the single place OpenCode wiring lives.
          - One command installs the plugin; nothing else is configured by hand.
      - id: plugin.install.opencode_from_git.golden_package_entry
        kind: steps
        steps:
          - Read package.json.
          - Confirm exports["."] points at opencode/plugin.js and the module is plain JavaScript with no imports the bundle does not already provide.
        observable_outcomes:
          - OpenCode can resolve the plugin module straight from the git checkout.
      - id: plugin.install.opencode_from_git.bad_missing_bootstrap
        kind: steps
        steps:
          - Call setup with the bootstrap file absent.
          - Read what still registers and what the injected text says.
        observable_outcomes:
          - The MCP server, skills and PATH still register, and the injected text says the bootstrap could not be read.
          - A missing file degrades the session rather than disabling the plugin.
      - id: plugin.install.opencode_from_git.edge_live_session
        kind: steps
        steps:
          - Load the module in an OpenCode session and ask for command -v uc, the MCP tool names and the bootstrap text.
          - Confirm uc resolves to the plugin's bin, the use-cases tools are listed and the bootstrap is present.
        observable_outcomes:
          - Everything the module registers is observable in a real session.
    observable_outcomes:
      - One command installs the plugin; nothing else is configured by hand.
      - The plugin module is the single place OpenCode wiring lives.
    host_applicability:
      - host_surface: opencode.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/plugin/opencode-plugin.test.ts
          inputs:
            - tests/plugin/opencode-plugin.test.ts
            - opencode/plugin.js
            - package.json
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
