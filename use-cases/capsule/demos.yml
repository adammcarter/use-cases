schema_version: 1
feature:
  id: capsule.demos
  name: Demo capsules
  summary: Optional persisted smoke and golden-path runbooks that become proof only when performed as showcase runs.
use_cases:
  - id: capsule.demos.persisted_smoke_runbook
    title: Persisted smoke demo runbook
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: common
    tags:
      - capsules
      - smoke
      - runbook
    source_refs:
      - kind: file
        path: docs/showcase.md
      - kind: file
        path: packages/core/src/capsules/loadCapsule.ts
    actor: agent
    intent: Provide a reusable capsule that references use-case IDs and supports repeatable demos.
    preconditions:
      - A common smoke or golden path deserves a persisted runbook.
    trigger: Agent or user wants a repeatable demonstration without reselecting rows manually.
    scenarios:
      - id: capsule.demos.persisted_smoke_runbook.golden_plan
        kind: steps
        steps:
          - Validate a capsule file.
          - Generate a capsule plan.
          - Confirm referenced use-case and scenario ids resolve.
        observable_outcomes:
          - The capsule is reusable prepared material whose references resolve.
      - id: capsule.demos.persisted_smoke_runbook.bad_a_capsule_is_not_proof
        kind: steps
        steps:
          - Validate and plan a capsule, then stop.
          - Read whether anything treats it as proven.
        observable_outcomes:
          - It is not proof until a run records performed events.
      - id: capsule.demos.persisted_smoke_runbook.edge_the_same_capsule_serves_repeated_demos
        kind: steps
        steps:
          - Plan the same capsule twice without reselecting rows.
          - Compare the two plans.
        observable_outcomes:
          - A persisted capsule gives a repeatable demonstration without reselecting rows by hand each time.
    observable_outcomes:
      - The capsule is reusable prepared material.
      - It is not proof until a run records performed events.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesOracle
            - --filter
            - CapsulePersistedRunbookTests
          inputs:
            - UseCasesOracle/Tests/OracleTests/Cli/CapsuleDemosTests.swift
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: capsule.demos.adhoc_release_demo
    title: Ad hoc release demo plan
    lifecycle: active
    value_tier: core
    journey_role: alternate
    usage_frequency: occasional
    tags:
      - capsules
      - adhoc
      - release
      - no-bad-path
    source_refs:
      - kind: file
        path: docs/showcase.md
      - kind: file
        path: packages/core/src/showcase/startRun.ts
    actor: agent
    intent: Generate a one-run plan for release proof without saving it as a reusable recipe.
    preconditions:
      - The demo is specific to a release, PR, or changed scope.
    trigger: Agent prepares a one-off live run.
    scenarios:
      - id: capsule.demos.adhoc_release_demo.golden_start
        kind: steps
        steps:
          - Select ad hoc use-case ids.
          - Start a showcase run from that selection.
          - Read the normalized plan recorded in run_started.
        observable_outcomes:
          - A one-off run records its normalized plan in run_started, so the selection is auditable afterwards.
      - id: capsule.demos.adhoc_release_demo.edge_no_capsule_file_is_left_behind
        kind: steps
        steps:
          - Run a one-off release demo.
          - Look for a persisted capsule file afterwards.
        observable_outcomes:
          - One-off demos are supported without accumulating unnecessary capsule files.
    observable_outcomes:
      - One-off demos are supported without accumulating unnecessary capsule files.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesOracle
            - --filter
            - CapsuleAdhocDemoTests
          inputs:
            - UseCasesOracle/Tests/OracleTests/Cli/CapsuleDemosTests.swift
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: ask
  - id: capsule.demos.runner_command_safety
    title: Hardened scripted capsule execution
    lifecycle: active
    value_tier: critical
    journey_role: negative
    usage_frequency: common
    tags:
      - capsules
      - command-runner
      - security
    source_refs:
      - kind: file
        path: packages/core/src/capsules/runCapsule.ts
      - kind: file
        path: docs/security.md
    actor: script
    intent: Run scripted capsule commands with explicit controls and no committed local-path leakage.
    preconditions:
      - A capsule contains command steps.
    trigger: Agent runs a capsule with command execution enabled.
    scenarios:
      - id: capsule.demos.runner_command_safety.golden_command
        kind: steps
        steps:
          - Grant command execution permission at both the capsule and the caller level.
          - Run the capsule and read how each command was executed.
        observable_outcomes:
          - Commands execute without a shell, from a working directory inside the repo, with bounded output recorded.
      - id: capsule.demos.runner_command_safety.bad_unsafe_commands_do_not_run_by_default
        kind: steps
        steps:
          - Run a capsule containing command steps without granting execution permission.
          - Read what happens.
        observable_outcomes:
          - Unsafe commands do not run by default; permission is required at the capsule AND the caller level.
      - id: capsule.demos.runner_command_safety.bad_working_directory_outside_the_repo
        kind: steps
        steps:
          - Point a command step's working directory outside the repository.
          - Run the capsule.
        observable_outcomes:
          - The working directory is resolved inside the repo, so a capsule cannot reach out of the workspace.
      - id: capsule.demos.runner_command_safety.edge_output_is_bounded_and_local_state_does_not_leak
        kind: steps
        steps:
          - Run a command producing very large output.
          - Read what is recorded as the observation and verdict.
        observable_outcomes:
          - Command results are recorded as observations and verdicts with bounded output, without leaking uncontrolled local state.
    observable_outcomes:
      - Unsafe commands do not run by default.
      - Command results are recorded as observations and verdicts without leaking uncontrolled local state.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesOracle
            - --filter
            - CapsuleCommandSafetyTests
          inputs:
            - UseCasesOracle/Tests/OracleTests/Cli/CapsuleCommandSafetyTests.swift
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: capsule.demos.stale_reference_warning
    title: Stale or missing capsule references
    lifecycle: active
    value_tier: supporting
    journey_role: edge
    usage_frequency: rare
    tags:
      - capsules
      - stale
      - diagnostics
    source_refs:
      - kind: file
        path: packages/core/src/capsules/loadCapsule.ts
      - kind: file
        path: packages/core/src/capsules/index.ts
    actor: agent
    intent: Warn when a persisted capsule points at missing, removed, or semantically changed rows.
    preconditions:
      - A capsule references use-case or scenario IDs.
    trigger: Agent validates or plans a capsule after matrix changes.
    scenarios:
      - id: capsule.demos.stale_reference_warning.golden_validate
        kind: steps
        steps:
          - Validate a capsule after related rows changed.
          - Read the diagnostics.
        observable_outcomes:
          - Diagnostics are reported before the capsule is run.
      - id: capsule.demos.stale_reference_warning.bad_missing_row_reference
        kind: steps
        steps:
          - Remove a row a capsule references, then validate the capsule.
          - Read what is reported.
        observable_outcomes:
          - A capsule pointing at a missing or removed row is reported rather than run.
      - id: capsule.demos.stale_reference_warning.edge_semantically_changed_row
        kind: steps
        steps:
          - Change a referenced row's meaning without removing it, then validate.
          - Read whether the drift is detected.
        observable_outcomes:
          - Persisted runbooks do not silently drift away from the matrix when a row changes underneath them.
    observable_outcomes:
      - Persisted runbooks do not silently drift away from the matrix.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesOracle
            - --filter
            - CapsuleStaleReferenceTests
          inputs:
            - UseCasesOracle/Tests/OracleTests/Cli/CapsuleCommandSafetyTests.swift
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: capsule.demos.runbook_not_proof
    title: Capsule is runbook, not proof
    lifecycle: active
    value_tier: critical
    journey_role: negative
    usage_frequency: common
    tags:
      - capsules
      - proof-boundary
      - no-edge-path
    source_refs:
      - kind: file
        path: docs/showcase.md
      - kind: file
        path: packages/core/src/capsules/runCapsule.ts
    actor: agent
    intent: Never treat a persisted or generated capsule as evidence until a live run records events.
    preconditions:
      - A capsule exists or a capsule plan has been generated.
    trigger: Agent summarizes proof, readiness, or release state.
    scenarios:
      - id: capsule.demos.runbook_not_proof.golden_guard
        kind: steps
        steps:
          - Inspect a capsule or a generated capsule plan.
          - Read how it describes itself.
        observable_outcomes:
          - It is reported as prepared material.
      - id: capsule.demos.runbook_not_proof.bad_a_capsule_never_becomes_evidence
        kind: steps
        steps:
          - Summarise proof, readiness or release state with only a capsule present.
          - Read whether the capsule counts.
        observable_outcomes:
          - Capsule files are not confused with performed demonstrations.
          - Showcase run events are required before proof is claimed.
    observable_outcomes:
      - Capsule files are not confused with performed demonstrations.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - swift
            - test
            - --package-path
            - UseCasesOracle
            - --filter
            - CapsuleRunbookNotProofTests
          inputs:
            - UseCasesOracle/Tests/OracleTests/Cli/CapsuleDemosTests.swift
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
