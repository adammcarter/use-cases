schema_version: 1
feature:
  id: mcp.wrapper
  name: MCP wrapper
  summary: MCP tools preserve the CLI envelope contract.
use_cases:
  - id: mcp.wrapper.parity
    title: Compiled MCP stdio preserves generated-plan showcase parity
    lifecycle: active
    value_tier: core
    journey_role: alternate
    usage_frequency: common
    tags:
      - mcp
      - cli
    source_refs:
      - kind: file
        path: packages/mcp/src/tools.ts
    actor: agent
    intent: Use MCP without inventing separate showcase or approval behavior.
    preconditions:
      - The compiled MCP server can load the packaged core.
    trigger: Agent runs a showcase through MCP stdio.
    scenarios:
      - id: mcp.wrapper.parity.golden_cli
        kind: steps
        steps:
          - Generate a showcase plan through MCP.
          - Start from the generated plan file through compiled stdio MCP.
          - Record observation, verdict and finish through MCP.
        observable_outcomes:
          - MCP returns CLI envelopes and records the same lifecycle events.
      - id: mcp.wrapper.parity.bad_approval_stays_pending
        kind: steps
        steps:
          - Request approval through MCP.
          - Read the run's approval state afterwards.
        observable_outcomes:
          - Requesting approval through MCP keeps approval pending; MCP never appends it.
      - id: mcp.wrapper.parity.edge_compiled_stdio_loads_the_packaged_core
        kind: steps
        steps:
          - Drive the flow through the COMPILED server over stdio rather than in process.
          - Confirm the same envelopes come back.
        observable_outcomes:
          - The compiled MCP server loads the packaged core, so parity holds for the artifact that actually ships.
    observable_outcomes:
      - MCP returns CLI envelopes
      - records the same lifecycle events
      - and keeps approval pending.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: none
    approval_policy:
      mode: none
  - id: mcp.use_case_mutation.safe
    title: MCP safely mutates use-case rows through core policy
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: common
    tags:
      - mcp
      - matrix
      - mutation
      - safety
    source_refs:
      - kind: file
        path: packages/mcp/src/tools.ts
      - kind: file
        path: packages/core/src/useCases/mutateUseCaseMatrix.ts
    actor: agent
    intent: Add, update, or retire use-case rows from an MCP host without bypassing CLI-equivalent validation.
    preconditions:
      - The caller passes an explicit repo root.
      - Write tools are called with allow_write true.
      - The current use-case matrix is complete enough to mutate safely.
    trigger: Agent calls use_case_upsert or use_case_remove through MCP.
    scenarios:
      - id: mcp.use_case_mutation.safe.golden_upsert
        kind: steps
        steps:
          - Call use_case_upsert with a target use-cases YAML file and one use_case object.
          - Validate that the matrix remains complete after the write.
        observable_outcomes:
          - MCP returns a matrix.upsert envelope and the matrix stays structurally clean.
      - id: mcp.use_case_mutation.safe.golden_remove
        kind: steps
        steps:
          - Call use_case_remove with a use-case id and a removal reason.
          - Read the row afterwards.
        observable_outcomes:
          - Delete is lifecycle removal, not physical deletion, so the history survives.
      - id: mcp.use_case_mutation.safe.bad_write_without_write_mode
        kind: steps
        steps:
          - Call a mutating tool without allow_write.
          - Read the envelope and the matrix.
        observable_outcomes:
          - Write mode is required before any mutation.
      - id: mcp.use_case_mutation.safe.bad_path_escape_or_damaged_matrix
        kind: steps
        steps:
          - Try a path escape, then try the same call against a damaged matrix.
          - Read both envelopes.
        observable_outcomes:
          - Damaged input or a path escape prevents mutation and returns a blocked CLI envelope.
      - id: mcp.use_case_mutation.safe.bad_actor_type_user_claim
        kind: steps
        steps:
          - Call a mutating tool claiming actor_type user.
          - Read whether it is honoured.
        observable_outcomes:
          - User approval or user actor claims are rejected without trusted host confirmation.
      - id: mcp.use_case_mutation.safe.edge_repo_root_must_be_explicit
        kind: steps
        steps:
          - Call a mutating tool without passing an explicit repo root.
          - Read what is required before the call proceeds.
        observable_outcomes:
          - The caller must pass an explicit repo root, so an MCP host can never mutate a workspace it did not name.
          - Ambiguity about WHICH workspace is being written to is refused rather than guessed.
    observable_outcomes:
      - MCP returns matrix.upsert or matrix.remove envelopes.
      - Write mode is required before any mutation.
      - User approval or user actor claims are rejected without trusted host confirmation.
      - Delete is lifecycle removal, not physical deletion.
      - Damaged input or a path escape prevents mutation.
    host_applicability:
      - host_surface: codex.cli
        supported: true
      - host_surface: claude.cli
        supported: true
      - host_surface: copilot.cli
        supported: true
      - host_surface: opencode.cli
        supported: true
    verification_policy:
      mode: none
    approval_policy:
      mode: none
