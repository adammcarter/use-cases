schema_version: 1
feature:
  id: matrix.product
  name: Product use-case matrix
  summary: Human-readable behavior inventory for product planning, acceptance, and showcase selection.
use_cases:
  - id: matrix.product.product_inventory
    title: Living product behavior inventory
    lifecycle: active
    value_tier: critical
    journey_role: golden
    usage_frequency: common
    tags:
      - matrix
      - product-behavior
      - dogfood
      - no-bad-path
    source_refs:
      - kind: file
        path: docs/data-model.md
      - kind: file
        path: packages/core/src/useCases/loadUseCaseMatrix.ts
    actor: agent
    intent: Represent Use Cases product behavior as stable, addressable use-case rows.
    preconditions:
      - Product behavior has been identified at feature level.
    trigger: Agent or user needs acceptance, proof, or demo coverage for the product.
    scenarios:
      - id: matrix.product.product_inventory.golden_cli
        kind: steps
        steps:
          - Run matrix list.
          - Confirm product-level rows exist alongside primitive support rows.
          - Confirm each row carries value, journey, usage and scenario data.
        observable_outcomes:
          - Product behaviour can be selected by row id without reading implementation code.
      - id: matrix.product.product_inventory.edge_primitive_rows_stay_supporting
        kind: steps
        steps:
          - List the rows and separate product-level from primitive ones.
          - Read how each is presented.
        observable_outcomes:
          - Primitive rows remain available as supporting proof rather than the whole product map.
    observable_outcomes:
      - Product behavior can be selected by row ID without reading implementation code.
      - Primitive rows remain available as supporting proof rather than the whole product map.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: command_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: matrix.product.sharded_human_readable_files
    title: Sharded readable feature files
    lifecycle: active
    value_tier: core
    journey_role: golden
    usage_frequency: common
    tags:
      - matrix
      - yaml
      - maintainability
    source_refs:
      - kind: file
        path: docs/data-model.md
      - kind: file
        path: schemas/v1/use-case-file.schema.json
    actor: agent
    intent: Keep rows in readable feature-area YAML files under use-cases.
    preconditions:
      - A workspace has a `use-cases/` directory.
    trigger: Agent adds, updates, reviews, or repairs use-case rows.
    scenarios:
      - id: matrix.product.sharded_human_readable_files.golden_layout
        kind: steps
        steps:
          - Place related rows in a feature shard with one feature summary.
          - Validate all shards as one matrix.
        observable_outcomes:
          - Users can inspect or edit a feature shard without opening one large matrix file.
          - Separate files validate as a single matrix.
      - id: matrix.product.sharded_human_readable_files.bad_damaged_shard_is_named
        kind: steps
        steps:
          - Damage one shard and leave the others intact.
          - Validate and read the per-file report.
        observable_outcomes:
          - Validation reports each loaded or damaged file separately, naming the damaged one.
      - id: matrix.product.sharded_human_readable_files.edge_one_feature_summary_per_file
        kind: steps
        steps:
          - Read each shard's feature block.
          - Confirm one feature summary per file.
        observable_outcomes:
          - A shard describes one feature area, so the file name predicts what is inside it.
    observable_outcomes:
      - Users can inspect or edit a feature shard without opening one large matrix file.
      - Validation reports each loaded or damaged file separately.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: command_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: matrix.product.integrity_degraded_nonfatal
    title: Degraded-but-nonfatal diagnostics
    lifecycle: active
    value_tier: critical
    journey_role: edge
    usage_frequency: occasional
    tags:
      - matrix
      - diagnostics
      - partial
    source_refs:
      - kind: file
        path: packages/core/src/useCases/loadUseCaseMatrix.ts
      - kind: file
        path: packages/core/src/useCases/integrity.ts
    actor: agent
    intent: Load valid rows despite damaged files while clearly blocking full coverage or sign-off when relevant.
    preconditions:
      - At least one use-case YAML file is damaged, duplicated, or partially invalid.
    trigger: Validation, planning, or status reads a partially damaged matrix.
    scenarios:
      - id: matrix.product.integrity_degraded_nonfatal.golden_partial
        kind: steps
        steps:
          - Validate a workspace with one valid shard and one damaged shard.
          - Confirm valid rows are still addressable.
        observable_outcomes:
          - A damaged use-case file keeps valid siblings addressable.
          - Damaged YAML does not bring down the whole system.
      - id: matrix.product.integrity_degraded_nonfatal.bad_damage_is_surfaced_not_swallowed
        kind: steps
        steps:
          - Validate the same workspace and read the integrity state and diagnostics.
          - Confirm the damaged file is identified.
        observable_outcomes:
          - Integrity is reported as partial and diagnostics identify the damaged file.
          - Tolerating damage is never the same as hiding it.
      - id: matrix.product.integrity_degraded_nonfatal.edge_partial_integrity_precedes_any_claim
        kind: steps
        steps:
          - Produce a plan or status over the partially damaged matrix.
          - Read what is said before any coverage claim.
        observable_outcomes:
          - Plans and status outputs surface partial integrity before any final claim.
    observable_outcomes:
      - Damaged YAML does not bring down the whole system.
      - Plans and status outputs surface partial integrity before any final claim.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/blackbox/matrix-product.test.ts
            - -t
            - matrix.product.integrity_degraded_nonfatal
          inputs:
            - tests/blackbox/matrix-product.test.ts
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
      required_for_release: true
  - id: matrix.product.coverage_by_value_and_journey
    title: Coverage by value and journey role
    lifecycle: active
    value_tier: core
    journey_role: alternate
    usage_frequency: occasional
    tags:
      - matrix
      - coverage
      - prioritization
      - no-bad-path
    source_refs:
      - kind: file
        path: packages/core/src/useCases/query.ts
      - kind: file
        path: packages/core/src/presentation/scoring.ts
    actor: agent
    intent: Let agents select and report rows by value tier, journey role, lifecycle, tags, and host relevance.
    preconditions:
      - Rows are tagged with value, journey, usage, lifecycle, and host applicability.
    trigger: Agent prepares a showcase, walkthrough, acceptance pass, or gap report.
    scenarios:
      - id: matrix.product.coverage_by_value_and_journey.golden_selection
        kind: steps
        steps:
          - List rows by value tier and journey role.
          - Select critical golden rows for a short showcase.
        observable_outcomes:
          - Filtering by value tier and journey role returns sound, non-empty slices.
          - High-value rows are easy to separate from long-tail or future rows.
      - id: matrix.product.coverage_by_value_and_journey.edge_deeper_cuts_reach_beyond_golden
        kind: steps
        steps:
          - Include alternate, edge, negative and failure rows for a walkthrough cut.
          - Read the resulting selection and its exclusions.
        observable_outcomes:
          - Showcase and walkthrough cuts can explain why rows were included or excluded.
    observable_outcomes:
      - High-value rows are easy to separate from long-tail or future rows.
      - Showcase and walkthrough cuts can explain why rows were included or excluded.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/blackbox/matrix-product.test.ts
            - -t
            - matrix.product.coverage_by_value_and_journey
          inputs:
            - tests/blackbox/matrix-product.test.ts
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: matrix.product.claim_guardrails
    title: Unsupported-claim guardrails
    lifecycle: active
    value_tier: critical
    journey_role: negative
    usage_frequency: common
    tags:
      - matrix
      - claims
      - safety
    source_refs:
      - kind: file
        path: docs/security.md
      - kind: file
        path: skills/showcase/SKILL.md
    actor: agent
    intent: Prevent verified, supported, signed-off, or release-ready claims when evidence or approval is missing.
    preconditions:
      - A row, plan, host profile, capsule, or generated output could be mistaken for proof.
    trigger: Agent summarizes readiness, support, approval, or release status.
    scenarios:
      - id: matrix.product.claim_guardrails.negative
        kind: steps
        steps:
          - Inspect the matrix and related evidence status.
          - Identify rows with missing proof or approval.
          - State the exact gap instead of claiming acceptance.
    observable_outcomes:
      - Prepared material is not described as performed proof.
      - Host support and user sign-off claims require recorded evidence.
    host_applicability:
      - host_surface: codex.cli
        supported: true
      - host_surface: claude.cli
        supported: true
      - host_surface: copilot.cli
        supported: true
      - host_surface: opencode.cli
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: agent_observation
          required_verifiers:
            - agent
          minimum_count: 1
    approval_policy:
      mode: none
  - id: matrix.product.status_summary
    title: One-shot matrix and evidence health summary
    lifecycle: active
    value_tier: supporting
    journey_role: alternate
    usage_frequency: occasional
    tags:
      - matrix
      - status
      - summary
    source_refs:
      - kind: file
        path: packages/core/src/useCases/query.ts
      - kind: file
        path: docs/cli.md
    actor: agent
    intent: Summarize matrix population, integrity state, and linked evidence status in a single read-only command for a quick health check.
    preconditions:
      - A use-case matrix exists, possibly with partial or missing evidence.
    trigger: Agent wants a fast readiness read before planning, release, or showcase.
    scenarios:
      - id: matrix.product.status_summary.golden_report
        kind: steps
        steps:
          - Run matrix status.
          - Inspect row counts, integrity state and evidence coverage.
        observable_outcomes:
          - Matrix and evidence health are readable in one command.
      - id: matrix.product.status_summary.bad_summary_is_never_a_cached_claim
        kind: steps
        steps:
          - Change a use-case file, then run matrix status again without any other step.
          - Compare the summary with the files on disk.
        observable_outcomes:
          - The summary is derived from current files, not a cached claim.
          - A stale number can never be reported as current health.
      - id: matrix.product.status_summary.edge_gaps_visible_without_a_full_plan_run
        kind: steps
        steps:
          - Run matrix status on a matrix with integrity or evidence gaps.
          - Read what is visible without running a plan.
        observable_outcomes:
          - Integrity or evidence gaps are visible without a full plan run.
    observable_outcomes:
      - Matrix and evidence health are readable in one command.
      - Integrity or evidence gaps are visible without a full plan run.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: command_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
