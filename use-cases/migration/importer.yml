schema_version: 1
feature:
  id: migration.importer
  name: TEST-MATRIX migration
  summary: Reviewable migration from legacy test matrices into use-case rows without laundering old proof.
use_cases:
  - id: migration.importer.reviewable_draft_import
    title: Reviewable TEST-MATRIX draft import
    lifecycle: active
    value_tier: core
    journey_role: alternate
    usage_frequency: occasional
    tags:
      - migration
      - test-matrix
      - backfill
    source_refs:
      - kind: file
        path: docs/migration.md
      - kind: file
        path: packages/core/src/migration/testMatrix.ts
    actor: agent
    intent: Convert legacy TEST-MATRIX rows into draft use-case YAML with review warnings.
    preconditions:
      - A legacy TEST-MATRIX.md file exists.
    trigger: User or agent backfills an existing project into Use Cases.
    scenarios:
      - id: migration.importer.reviewable_draft_import.golden_dry_run
        kind: steps
        steps:
          - Run migrate test-matrix in dry-run mode.
          - Inspect the generated draft rows and diagnostics.
        observable_outcomes:
          - Legacy rows become draft use cases, not silent active acceptance.
      - id: migration.importer.reviewable_draft_import.bad_import_is_never_silently_active
        kind: steps
        steps:
          - Import a legacy matrix and read the lifecycle of every generated row.
          - Confirm none is active.
        observable_outcomes:
          - An import cannot produce an active row, so migration never grants acceptance by itself.
      - id: migration.importer.reviewable_draft_import.edge_review_warnings_name_what_is_ambiguous
        kind: steps
        steps:
          - Import rows with ambiguous titles, old statuses and missing detail.
          - Read the review warnings.
        observable_outcomes:
          - Review warnings identify ambiguous titles, old statuses and missing detail, so a reviewer knows where to look.
    observable_outcomes:
      - Legacy rows become draft use cases, not silent active acceptance.
      - Review warnings identify ambiguous titles, old statuses, and missing detail.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/blackbox/migration-importer.test.ts
            - -t
            - migration.importer.reviewable_draft_import
          inputs:
            - tests/blackbox/migration-importer.test.ts
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: ask
  - id: migration.importer.no_legacy_pass_as_proof
    title: Legacy pass marks are not evidence
    lifecycle: active
    value_tier: critical
    journey_role: negative
    usage_frequency: common
    tags:
      - migration
      - evidence
      - proof-boundary
    source_refs:
      - kind: file
        path: docs/migration.md
      - kind: file
        path: packages/core/src/migration/testMatrix.ts
    actor: agent
    intent: Prevent old pass or status cells from becoming current evidence or approval.
    preconditions:
      - Legacy matrix rows include status text such as pass, fail, done, or accepted.
    trigger: Agent migrates legacy matrix content.
    scenarios:
      - id: migration.importer.no_legacy_pass_as_proof.golden_guard
        kind: steps
        steps:
          - Parse legacy rows carrying old status marks such as pass, done or accepted.
          - Read the generated rows.
        observable_outcomes:
          - Generated rows carry no evidence ids.
      - id: migration.importer.no_legacy_pass_as_proof.bad_an_old_pass_mark_never_becomes_evidence
        kind: steps
        steps:
          - Import rows marked pass, then read evidence status for them.
          - Confirm nothing counts as current proof.
        observable_outcomes:
          - Current evidence must be recorded separately through the evidence ledger.
          - Migration cannot invent modern proof or user approval.
      - id: migration.importer.no_legacy_pass_as_proof.edge_old_status_survives_as_review_context
        kind: steps
        steps:
          - Read where an old status mark ends up in the generated row.
          - Confirm it is context, not a claim.
        observable_outcomes:
          - Old status is preserved only as review context, where it cannot be mistaken for proof.
    observable_outcomes:
      - Current evidence must be recorded separately through the evidence ledger.
      - Migration cannot invent modern proof or user approval.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/blackbox/migration-importer.test.ts
            - -t
            - migration.importer.no_legacy_pass_as_proof
          inputs:
            - tests/blackbox/migration-importer.test.ts
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: migration.importer.source_traceability
    title: Migration source traceability
    lifecycle: active
    value_tier: supporting
    journey_role: alternate
    usage_frequency: rare
    tags:
      - migration
      - traceability
      - no-bad-path
    source_refs:
      - kind: file
        path: docs/migration.md
      - kind: file
        path: tests/fixtures/workspaces/test-matrix-source/TEST-MATRIX.md
    actor: agent
    intent: Preserve original markdown row references so reviewers can audit generated draft rows.
    preconditions:
      - A migration source file has identifiable source rows.
    trigger: Agent writes or reviews migrated draft use-case YAML.
    scenarios:
      - id: migration.importer.source_traceability.golden_refs
        kind: steps
        steps:
          - Generate draft rows from a TEST-MATRIX source.
          - Read the source references or diagnostics for the original rows.
        observable_outcomes:
          - Migration output can be audited against its source.
      - id: migration.importer.source_traceability.edge_a_reviewer_can_compare_row_to_source_intent
        kind: steps
        steps:
          - Take one generated row and find the markdown row it came from.
          - Compare the two.
        observable_outcomes:
          - A reviewer can trace any generated row back to the source row it was built from.
    observable_outcomes:
      - Migration output can be audited against its source.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      verifiers:
        script:
          kind: script
          evidence_kind: test_result
          command:
            - pnpm
            - -s
            - vitest
            - run
            - tests/blackbox/migration-importer.test.ts
            - -t
            - migration.importer.source_traceability
          inputs:
            - tests/blackbox/migration-importer.test.ts
      requirements:
        - evidence_kind: test_result
          required_verifiers:
            - script
          minimum_count: 1
    approval_policy:
      mode: none
  - id: migration.importer.human_review_activation
    title: Human review before activation
    lifecycle: active
    value_tier: core
    journey_role: alternate
    usage_frequency: occasional
    tags:
      - migration
      - review
      - activation
    source_refs:
      - kind: file
        path: docs/migration.md
      - kind: file
        path: skills/use-cases/SKILL.md
    actor: agent
    intent: Keep migrated rows draft or planned until a human reviews the high-level feature printout.
    preconditions:
      - Migration output contains draft or uncertain rows.
    trigger: Agent considers activating migrated rows.
    scenarios:
      - id: migration.importer.human_review_activation.golden_review
        kind: steps
        steps:
          - Present a concise feature printout of the migrated rows.
          - Ask the user to confirm high-value behaviour and scope.
          - Activate only the reviewed rows.
        observable_outcomes:
          - Migration review separates mechanical parsing from product acceptance.
      - id: migration.importer.human_review_activation.bad_activation_without_review
        kind: steps
        steps:
          - Attempt to activate migrated rows with no human review.
          - Read what is required first.
        observable_outcomes:
          - Migrated rows stay draft or planned until a human has reviewed the feature printout.
      - id: migration.importer.human_review_activation.edge_structurally_unusable_rows_stay_draft
        kind: steps
        steps:
          - Review a set including rows that are reviewed but structurally incomplete.
          - Read which are activated.
        observable_outcomes:
          - Only rows that are both reviewed AND structurally usable are activated.
    observable_outcomes:
      - Migration review separates mechanical parsing from product acceptance.
    host_applicability:
      - host_surface: codex.cli
        supported: true
    verification_policy:
      mode: requirements
      requirements:
        - evidence_kind: manual_observation
          required_verifiers:
            - user
          minimum_count: 1
    approval_policy:
      mode: ask
